version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: 1337b04rd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: 1337b04rd
      POSTGRES_USER: board_user
      POSTGRES_PASSWORD: board_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    container_name: 1337b04rd_minio
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web Console
    volumes:
      - minio-data:/data
      

  mc:
    image: minio/mc
    container_name: 1337b04rd_mc
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: ["/scripts/init-bucket.sh"]
    volumes:
      - ./init-bucket.sh:/scripts/init-bucket.sh

volumes:
  pgdata:
  minio-data:


# Доступы
# PostgreSQL:

# host: localhost

# port: 5432

# user: board_user

# password: board_pass

# db: 1337b04rd

# MinIO:

# Web UI: http://localhost:9001

# S3 Endpoint: http://localhost:9000

# Access Key: minioadmin

# Secret Key: minioadmin