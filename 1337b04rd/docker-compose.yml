version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: 1337b04rd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: 1337b04rd
      POSTGRES_USER: board_user
      POSTGRES_PASSWORD: board_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./init.sql:/docker-entrypoint-initdb.d/02_init.sql
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    container_name: 1337b04rd_minio
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: minioadmin_new
      MINIO_ROOT_PASSWORD: minioadmin_new_password
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - 1337b04rd_minio-data:/data

  mc:
    image: minio/mc
    container_name: 1337b04rd_mc
    depends_on:
      - minio
    entrypoint: /bin/sh
    command: >
      -c "
        sleep 10 &&
        mc alias set local http://minio:9000 minioadmin_new minioadmin_new_password &&
        mc mb local/posts || echo 'bucket posts already exists' &&
        mc anonymous set download local/posts &&
        mc mb local/comments || echo 'bucket comments already exists' &&
        mc anonymous set download local/comments
      "
    environment:
      MINIO_ROOT_USER: minioadmin_new
      MINIO_ROOT_PASSWORD: minioadmin_new_password

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 1337b04rd_app
    depends_on:
      - postgres
      - minio
    ports:
      - "8083:8083"
    environment:
      - DB_HOST=1337b04rd_postgres
      - DB_PORT=5432
      - DB_USER=board_user
      - DB_PASSWORD=board_pass
      - DB_NAME=1337b04rd
      - DB_SSLMODE=disable
      - MINIO_HOST=1337b04rd_minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - PORT=8083
    restart: always

volumes:
  pgdata: {}
  1337b04rd_minio-data: {}
