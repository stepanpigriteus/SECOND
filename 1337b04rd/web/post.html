<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Page</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F5F8FA;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        main {
            width: 600px;
            background-color: #fff;
            padding: 20px;
            border: 1px solid #E1E8ED;
            border-radius: 8px;
            margin-top: 20px;
        }

        nav {
            text-align: center;
            margin-bottom: 20px;
        }

        nav a {
            text-decoration: none;
            color: #1DA1F2;
            font-weight: bold;
            margin: 0 10px;
            padding: 8px 16px;
            border: 1px solid #1DA1F2;
            border-radius: 9999px;
            transition: background-color 0.2s, color 0.2s;
        }

        nav a:hover {
            background-color: #1DA1F2;
            color: white;
        }

        .post,
        .comment {
            border-bottom: 1px solid #E1E8ED;
            padding: 16px 0;
            list-style: none;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .header img {
            border-radius: 50%;
            width: 48px;
            height: 48px;
        }

        .header-info {
            display: flex;
            flex-direction: column;
        }

        .header-info b {
            color: #14171A;
        }

        .header-info span {
            color: #657786;
            font-size: 13px;
        }

        .content .text {
            font-size: 15px;
            color: #14171A;
            margin-bottom: 10px;
        }

        .content img {
            border-radius: 12px;
            max-width: 100%;
        }

        .comments h2 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #14171A;
        }

        .comment .content {
            padding-left: 60px;
        }

        .answer-button {
            background: none;
            border: none;
            color: #1DA1F2;
            font-size: 14px;
            cursor: pointer;
            padding: 0;
            margin-top: 6px;
        }

        .answer-button:hover {
            text-decoration: underline;
        }

        .add-comment {
            margin-top: 30px;
        }

        .add-comment h3 {
            font-size: 18px;
            color: #14171A;
        }

        .add-comment textarea {
            width: 95%;
            border: 1px solid #E1E8ED;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            resize: vertical;
            margin-top: 8px;
        }

        .add-comment input[type="file"] {
            margin: 10px 0;
        }

        .add-comment input[type="submit"] {
            padding: 8px 20px;
            background-color: #1DA1F2;
            color: white;
            border: none;
            border-radius: 9999px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-comment input[type="submit"]:hover {
            background-color: #1991DA;
        }
    </style>
</head>

<body>
    <main>
        <nav>
            <a href="/catalog">Catalog</a>
            <a href="/archive">Archive</a>
        </nav>

        <div class="post">
            <div class="header">
                <img src="{{.UserAvatar}}" alt="avatar">
                <div class="header-info">
                    <b>{{.UserName}}</b>
                    <span>{{.CreatedAt}}</span>
                    <span>ID: {{.PostID}}</span>
                </div>
            </div>
            <div class="content">
                <div class="text">
                    <h3>{{.Title}}</h3>
                    {{.Content}}
                </div>
                {{if .Image}}
                <img src="{{.Image}}" alt="image">
                {{end}}
            </div>
        </div>

        <div class="comments">
            <h2>Comments</h2>
            <ul class="comment-list">
                {{range .Comments}}
                <li class="comment">
                    <div class="header">
                        <img src="{{.AvatarURL}}" alt="avatar">
                        <div class="header-info">
                            <b>{{.UserName}}</b>
                            <span>{{.CreatedAt}} · ParentID: {{.ParentID}}</span>
                        </div>
                    </div>
                    <div class="content">
                        <div class="text">{{.Content}}</div>
                        {{if .Image}}
                        <img src="{{.Image}}" alt="comment image">
                        {{end}}
                        <button type="button" class="answer-button" data-parent-id="{{.CommentID}}">Reply</button>
                    </div>
                </li>
                {{end}}
            </ul>
        </div>

        <div class="add-comment">
            <h3>Add a Comment</h3>
            <iframe id="hiddenFrame" name="hiddenFrame" style="display:none;"></iframe>
            <form class="form" id="commentForm" action="/post/comment" method="POST" enctype="multipart/form-data"
                target="hiddenFrame">
                <textarea name="comment" placeholder="What's happening?"></textarea>
                <input type="hidden" name="post_id" value="{{.PostID}}">
                <input type="hidden" name="parent_id" id="parentId">
                <input type="file" name="file" id="file">
                <br>
                <input type="submit" value="Tweet">
            </form>
        </div>
    </main>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("commentForm");
            const MAX_FILE_SIZE = 20 * 1024 * 1024;

            form.addEventListener("submit", (event) => {
                event.preventDefault();

                const fileInput = document.querySelector('input[type="file"]');
                const file = fileInput ? fileInput.files[0] : null;


                if (file && file.size > MAX_FILE_SIZE) {
                    alert('Размер файла превышает максимальный допустимый размер (10MB)');
                    return;
                }

                const formData = new FormData(form);

                fetch(form.action, {
                    method: 'POST',
                    body: formData
                })
                    .then(response => {
                        if (!response.ok) {
                            return response.text();
                        }
                        return response.json();
                    })
                    .then(data => {

                        if (typeof data === 'string') {
                            alert(data);
                        } else {

                            alert('Комментарий успешно добавлен!');
                            window.location.reload();
                        }
                    })
                    .catch(error => {
                        alert('Ошибка при отправке комментария');
                    });
            });


            document.getElementById("parentId").value = "";

            document.querySelectorAll('.answer-button').forEach(button => {
                button.addEventListener('click', function () {
                    const parentId = this.getAttribute('data-parent-id');
                    document.getElementById('parentId').value = parentId;
                });
            });
        });
    </script>
</body>

</html>
