<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #E6E9F5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            margin: auto;
            max-width: 600px;
        }

        header {
            text-align: center;
        }

        main {
            margin: 10px;

        }

        .post .header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .post .content {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }

        .post .content img {
            width: 300px;
            height: auto;
        }

        .comment .header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .comment .content {
            margin-top: 10px;
            display: flex;
            gap: 20px;
        }

        .add-comment textarea {
            width: 100%;
            height: 100px;
        }

        .add-comment input[type="file"] {
            margin-top: 10px;
        }

        .add-comment input[type="submit"] {
            margin-top: 10px;
            display: block;
        }
    </style>
</head>

<body>
    <header>
        <h1>Thread Title</h1>
    </header>
    <main>
        <!-- Main Post -->
        <div class="post">
            <div class="header">
                <img src="{{.UserAvatar}}" alt="no pic" width="50" height="50">
                <b>{{.UserName}}</b>
                {{.CreatedAt}}
                {{.PostID}}
            </div>
            <div class="content">
                <img src=" {{.Image}}" alt="no pic">
                <div class="text">
                    <h3>{{.Title}}</h3>
                    {{.Content}}
                </div>
            </div>
        </div>

        <!-- Comments Section -->
        <div class="comments">
            <h2>Comments</h2>
            <ul class="comment-list">
                {{range .Comments}}
                <li class="comment">
                    <div class="header">
                        <img src="{{.AvatarURL}}" alt="no pic" width="50" height="50">
                        <b>{{.UserName}}</b>
                        {{.CreatedAt}}
                        {{.CommentID}}
                    </div>
                    <div class="content">
                        <!-- <img src="{{.Image}}" -->
                        alt="no pic" width="100" height="100">
                        <div class="text">
                            {{.Content}}
                        </div>
                    </div>
                </li>
                {{end}}
            </ul>
        </div>

        <!-- Add a Comment Section -->
        <div class="add-comment">
            <h3>Add a Comment</h3>
            <form action="/submit-comment" method="POST" enctype="multipart/form-data">
                <textarea name="comment" placeholder="Write your comment here..."></textarea>
                <br>
                <label for="file">File:</label>
                <input id="file" name="file" type="file">
                <br>
                <input type="submit" value="Submit">
            </form>
        </div>
    </main>
</body>

</html>
