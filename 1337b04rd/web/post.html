<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Page</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F5F8FA;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
    
        main {
            width: 600px;
            background-color: #fff;
            padding: 20px;
            border: 1px solid #E1E8ED;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .title {
            display: flex;
            justify-content: center;
        }
        
        .post, .comment {
            border-bottom: 1px solid #E1E8ED;
            padding: 16px 0;
        }

        .avatar_img {
            width: 50px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .header img {
            border-radius: 50%;
            width: 48px;
            height: 48px;
        }

        .header b {
            font-weight: bold;
            color: #14171A;
        }

        .header span {
            color: #657786;
            font-size: 14px;
        }

        .content .text {
            font-size: 15px;
            color: #14171A;
            text-align: left;
        }

        .content img {
            border-radius: 12px;
            max-width: 100%;
            margin-top: 10px;
        }

        .comments h2 {
            font-size: 18px;
            border-bottom: 1px solid #E1E8ED;
            padding-bottom: 10px;
            color: #14171A;
            text-align: left;
        }

        .comment .content {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .add-comment {
            margin: 20px 5%;
            text-align: left;
        }

        .add-comment h3 {
            font-size: 18px;
            color: #14171A;
        }

        .add-comment textarea {
            width: 80%;
            border: 1px solid #E1E8ED;
            border-radius: 8px;
            padding: 10px;
            margin: 0 5%;
            font-size: 14px;
            resize: vertical;
        }

        .add-comment input[type="file"] {
            margin-top: 10px;
        }

        .add-comment input[type="submit"] {
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #1DA1F2;
            color: white;
            border: none;
            border-radius: 9999px;
            font-weight: bold;
            cursor: pointer;
        }

        .answer-button {
            background: none;
            border: none;
            color: #1DA1F2;
            font-size: 14px;
            margin-top: 5px;
            cursor: pointer;
            padding: 0;
            text-align: left;
        }

        .answer-button:hover {
            text-decoration: underline;
        }

        /* New Styles for Navigation Buttons */
        nav {
            padding: 20px 0;
            text-align: center;
        }

        nav a {
            text-decoration: none;
            padding: 10px 20px;
            margin: 0 10px;
            border-radius: 20px;
            color: #1DA1F2;
            background-color: #fff;
            font-weight: bold;
            border: 1px solid #E1E8ED;
            transition: all 0.3s ease;
        }

        nav a:hover {
            background-color: #1DA1F2;
            color: white;
        }

    </style>
</head>

<body>
    <header>
       
    </header>

    <main>
        <nav>
            <!-- Navigation links styled as Twitter-like buttons -->
            <a href="/catalog">Catalog</a>
            <a href="/archive">Archive</a>
        </nav>
        <!-- Main Post -->
        <div class="post">
            <div class="header">
                <img class="avatar_img" src="{{.UserAvatar}}" alt="no pic">
                <div>
                    <b>{{.UserName}}</b> <br>
                    <span>{{.CreatedAt}}</span>
                </div>
            </div>
            <div class="content">
                <div class="text">
                    <h3>{{.Title}}</h3>
                    {{.Content}}
                </div>
                {{if .Image}}
                <img src="{{.Image}}" alt="no pic">
                {{end}}
            </div>
        </div>

        <!-- Comments Section -->
        <div class="comments">
            <h2>Comments</h2>
            <ul class="comment-list">
                {{range .Comments}}
                <li class="comment">
                    <div class="header">
                        <img src="{{.AvatarURL}}" alt="no pic">
                        <div>
                            <b>{{.UserName}}</b> <br>
                            <span>{{.CreatedAt}} · ParentID: {{.ParentID}}</span>
                        </div>
                    </div>
                    <div class="content">
                        <div class="text">{{.Content}}</div>
                        {{if .Image}}
                        <img src="{{.Image}}" alt="no pic">
                        {{end}}
                        <button type="button" class="answer-button" data-parent-id="{{.CommentID}}">Reply</button>
                    </div>
                </li>
                {{end}}
            </ul>
        </div>

        <!-- Add a Comment Section -->
        <div class="add-comment">
            <h3>Add a Comment</h3>
            <iframe id="hiddenFrame" name="hiddenFrame" style="display:none;"></iframe>
            <form  class="form" id="commentForm" action="/post/comment" method="POST" enctype="multipart/form-data" target="hiddenFrame">
                <textarea name="comment" placeholder="Write your comment here..."></textarea>
                <br>
                <label for="file">File:</label>
                <input type="hidden" name="post_id" value="{{.PostID}}">
                <input type="hidden" name="parent_id" id="parentId">
                <input type="file" name="file" id="file">
                <br>
                <input type="submit" value="Submit">
            </form>
        </div>
    </main>

    <script>
        // JavaScript for handling the "Reply" button
        document.querySelectorAll('.answer-button').forEach(button => {
            button.addEventListener('click', function() {
                const parentId = this.getAttribute('data-parent-id');
                document.getElementById('parentId').value = parentId; // Set the value of the hidden field
            });
        });
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('parentId').value = '';
        });
    </script>
</body>

</html>
